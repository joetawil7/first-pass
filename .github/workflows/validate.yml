name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so a validator release cannot turn CI red with no change here. Bump on purpose.
      - name: Plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.280
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json

      - name: Every skill has a name matching its folder and a description
        run: |
          status=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(sed -n 's/^name: *//p' "$f" | head -1)
            desc=$(sed -n 's/^description: *//p' "$f" | head -1)
            if [ "$name" != "$dir" ]; then echo "::error file=$f::name '$name' does not match folder '$dir'"; status=1; fi
            if [ -z "$desc" ]; then echo "::error file=$f::missing description"; status=1; fi
          done
          exit $status

      - name: Skills and the agent the rules name exist
        run: |
          status=0
          for s in premortem ship-check fix-the-class setup-first-pass habit-words sharpen review; do
            [ -f "skills/$s/SKILL.md" ] || { echo "::error::skills/$s/SKILL.md is referenced but missing"; status=1; }
          done
          [ -f skills/setup-first-pass/assets/breaker.md ] || { echo "::error::breaker agent missing"; status=1; }
          exit $status

      - name: Each block has exactly one start and one end marker
        run: |
          status=0
          check() {
            n=$(grep -c "$2" "$1")
            if [ "$n" != 1 ]; then echo "::error file=$1::'$2' appears $n times, expected 1"; status=1; fi
          }
          for block in rules profile words workspace project; do
            check "skills/setup-first-pass/assets/$block-block.md" "first-pass:$block:start"
            check "skills/setup-first-pass/assets/$block-block.md" "first-pass:$block:end"
          done
          exit $status

      - name: Managed block versions match plugin.json
        run: |
          v=$(node -p "require('./.claude-plugin/plugin.json').version")
          status=0
          for block in rules profile words; do
            if ! grep -q "first-pass:$block:start v$v " "skills/setup-first-pass/assets/$block-block.md"; then
              echo "::error::$block-block.md version does not match plugin.json $v"; status=1
            fi
          done
          exit $status

      - name: Hooks point at scripts that exist
        run: |
          node -e '
            const hooks = require("./hooks/hooks.json").hooks;
            const fs = require("fs");
            let bad = 0;
            for (const [event, groups] of Object.entries(hooks)) for (const g of groups) for (const h of g.hooks) {
              for (const arg of h.args ?? []) {
                const file = arg.replace("${CLAUDE_PLUGIN_ROOT}/", "");
                if (arg.includes("${CLAUDE_PLUGIN_ROOT}") && !fs.existsSync(file)) { console.log(`::error::${event} hook runs ${file}, which is missing`); bad = 1; }
              }
            }
            process.exit(bad);'

      - name: Tests
        run: node --test test/*.test.mjs

      # The projects first-pass came from stay private. The pattern is split so this file
      # does not match itself.
      - name: No private project names
        run: |
          if git grep -n -i -E 'brand[i]os|prop[w]ise|prop[i]lot'; then
            echo "::error::a private project name is in the repo"; exit 1
          fi
